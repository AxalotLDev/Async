plugins {
    id 'fabric-loom'
    id 'idea'
}

repositories {
    maven { url = 'https://maven.bawnorton.com/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        if (project.hasProperty('parchment_minecraft_version') && project.hasProperty('parchment_mappings_version')) {
            def mcVer = project.parchment_minecraft_version
            def mapVer = project.parchment_mappings_version

            if (mcVer != null && mapVer != null && !mcVer.isBlank() && !mapVer.isBlank()) {
                parchment("org.parchmentmc.data:parchment-${mcVer}:${mapVer}@zip")
            }
        }
    }
    modCompileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    implementation("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    implementation("org.ow2.asm:asm:9.6")
    implementation("org.ow2.asm:asm-tree:9.6")
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
}

loom {
    mixin.useLegacyMixinAp = true
    def aw = project(':common').file("src/main/resources/async.accesswidener")
    accessWidenerPath.set(project(":common").file("src/main/resources/async.accesswidener"))
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("async.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}