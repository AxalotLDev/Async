plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "com.modrinth.minotaur" version "2.+"
    id 'idea'
    id 'java-library'
}

repositories {
    maven { url 'https://api.modrinth.com/maven' }
}

apply plugin: 'com.modrinth.minotaur'
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "async"
    versionNumber.set(project.version.toString())
    versionName.set(project.version.toString())
    versionType = "alpha"
    def libsDir = layout.buildDirectory.dir("libs").get().asFile
    uploadFile = libsDir.listFiles().find { it.name.endsWith(".jar") }
    gameVersions = ["1.21.11"]
    loaders = ["fabric", "quilt"]
    dependencies {
        required.project "fabric-api"
        optional.project "lithium"
        optional.project "c2me-fabric"
        incompatible.project "moonrise-opt"
        incompatible.project "open-parties-and-claims"
    }
    changelog = """## 🦎 New Mod Update 🦎

### ⚡ Performance
- Portals optimization
- Spawn and despawn optimization
- Switched to batch entity ticking system

### ✨ New
- Update config
- Update statistics
- Added command permissions
- Added OpenPartiesAndClaims as incompatible mod
- Added synchronization of incompatible mods (Create, Fowlplay)

### 🐛 Bug Fixes
- Fixed deadlocks *~~again~~*
- Fixed bugs with riding entity
- Fixed bugs with entity effects
- Fixed door interaction logic for villagers
- `BrainMixin` rewritten with snapshot-based memory reads
- Disabled Lithium `mixin.ai.task.memory_change_counting`
- `ChunkHolderMixin`, `LevelTicksMixin`, `EntitySectionMixin` synchronization improved
"""
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
//    mappings loom.layered {
//        officialMojangMappings()
//        if (project.hasProperty('parchment_minecraft_version') && project.hasProperty('parchment_mappings_version')) {
//            def mcVer = project.parchment_minecraft_version
//            def mapVer = project.parchment_mappings_version
//
//            if (mcVer != null && mapVer != null && !mcVer.isBlank() && !mapVer.isBlank()) {
//                parchment("org.parchmentmc.data:parchment-${mcVer}:${mapVer}@zip")
//            }
//        }
//    }
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}")))
    implementation 'com.electronwill.night-config:toml:3.8.1'
    include group: 'com.electronwill.night-config', name: 'toml', version: '3.8.1'
    include group: 'com.electronwill.night-config', name: 'core', version: '3.8.1'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    implementation(include("me.lucko:fabric-permissions-api:${project.permission_api}"))
}

loom {
//    mixin.useLegacyMixinAp = true
    def aw = project(':common').file("src/main/resources/async.accesswidener")
    accessWidenerPath.set(project(":common").file("src/main/resources/async.accesswidener"))
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("async.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            vmArgs(
                    "-Xms12G",
                    "-Xmx12G",
                    "-XX:+UnlockExperimentalVMOptions",
                    "-XX:+UseZGC",
                    "-XX:+ZGenerational",
                    "-XX:+AlwaysPreTouch",
                    "-XX:+DisableExplicitGC",
                    "-XX:+UseDynamicNumberOfGCThreads"
            )
        }
    }
}